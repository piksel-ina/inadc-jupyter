name: Build Jupyter Image
run-name: "Jupyter: ${{ github.ref_name }}"

on:
  push:
    tags:
      - "jupyter-lab-v*"
      - "dev-jupyter-v*"

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      dockerfile: ${{ steps.parse.outputs.dockerfile }}
      ecr_repo: ${{ steps.parse.outputs.ecr_repo }}
      cache_repo: ${{ steps.parse.outputs.cache_repo }}
      image_tag: ${{ steps.parse.outputs.image_tag }}
    steps:
      - name: Validate tag format
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          if [[ "$TAG_NAME" =~ ^jupyter-lab-v[0-9]{8}-[0-9]{4}$ ]]; then
            echo "Tag format valid (production): $TAG_NAME"
          elif [[ "$TAG_NAME" =~ ^dev-jupyter-v[0-9]{8}-[0-9]{4}$ ]]; then
            echo "Tag format valid (dev): $TAG_NAME"
          else
            echo "::error::Invalid tag format: $TAG_NAME"
            echo "Expected: jupyter-lab-vYYYYMMDD-HHMM or dev-jupyter-vYYYYMMDD-HHMM"
            exit 1
          fi

      - name: Parse image target
        id: parse
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ "$TAG" == dev-jupyter-v* ]]; then
            echo "dockerfile=docker/jupyter-dev/Dockerfile" >> "$GITHUB_OUTPUT"
            echo "ecr_repo=jupyter-dev" >> "$GITHUB_OUTPUT"
            echo "cache_repo=jupyter-dev-cache" >> "$GITHUB_OUTPUT"
            echo "image_tag=${TAG#dev-jupyter-}" >> "$GITHUB_OUTPUT"
          else
            echo "dockerfile=docker/jupyter/Dockerfile" >> "$GITHUB_OUTPUT"
            echo "ecr_repo=jupyter-lab" >> "$GITHUB_OUTPUT"
            echo "cache_repo=jupyter-lab-cache" >> "$GITHUB_OUTPUT"
            echo "image_tag=${TAG#jupyter-lab-}" >> "$GITHUB_OUTPUT"
          fi

  build-push:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: gha-inadc-jupyter
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ECR_REGISTRY }}/${{ needs.prepare.outputs.ecr_repo }}
          labels: |
            org.opencontainers.image.title=inadc-jupyter
            org.opencontainers.image.version=${{ needs.prepare.outputs.image_tag }}
            org.opencontainers.image.vendor=Badan Informasi Geospasial

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ needs.prepare.outputs.dockerfile }}
          push: true
          tags: ${{ env.ECR_REGISTRY }}/${{ needs.prepare.outputs.ecr_repo }}:${{ needs.prepare.outputs.image_tag }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ needs.prepare.outputs.cache_repo }}
          cache-to: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ needs.prepare.outputs.cache_repo }},mode=max
          platforms: linux/amd64

      - name: Build Summary
        if: success()
        run: |
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## Docker Build Report
          Successfully built and pushed to ECR.

          ### ${{ env.ECR_REGISTRY }}/${{ needs.prepare.outputs.ecr_repo }}:${{ needs.prepare.outputs.image_tag }}

          **Dockerfile**: \`${{ needs.prepare.outputs.dockerfile }}\`
          **Cache**: \`${{ env.ECR_REGISTRY }}/${{ needs.prepare.outputs.cache_repo }}\`

          EOF
