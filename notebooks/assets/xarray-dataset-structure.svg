<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="700" height="331"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif"
     font-size="14">
  <title>Structure of the xarray.Dataset returned by dc.load</title>
  <desc>An xarray.Dataset organises its content into four parts: dimensions, data variables (which are DataArrays), coordinates, and attributes. Each part is labelled and explained.</desc>

  <!-- Outer Dataset frame -->
  <rect x="6" y="6" width="708" height="328" fill="#fafbfc" stroke="#888" stroke-width="1.5"/>
  <text x="18" y="26" font-weight="700" font-size="15" fill="#222">xarray.Dataset</text>

  <!-- DIMENSIONS (top-left) -->
  <text x="22" y="56" font-weight="600" fill="#333">Dimensions</text>
  <rect x="22" y="64" width="320" height="40" fill="#eaf0fa" stroke="#9eb4d2"/>
  <text x="34" y="89" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#222">time: 2  •  y: 369  •  x: 372</text>
  <text x="22" y="124" font-size="12.5" font-style="italic" fill="#666">how many time slices, rows, and columns of pixels</text>

  <!-- DATA VARIABLES (top-right) -->
  <text x="370" y="56" font-weight="600" fill="#333">Data variables (each is a DataArray)</text>
  <rect x="370" y="64" width="328" height="92" fill="#ffffff" stroke="#cccccc"/>

  <rect x="380" y="72" width="5" height="14" fill="#c33"/>
  <text x="394" y="84" font-weight="600" font-size="13" fill="#c33">red</text>
  <text x="442" y="84" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#222">(time, y, x)</text>
  <text x="558" y="84" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#666">uint16</text>

  <rect x="380" y="90" width="5" height="14" fill="#383"/>
  <text x="394" y="102" font-weight="600" font-size="13" fill="#383">green</text>
  <text x="442" y="102" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#222">(time, y, x)</text>
  <text x="558" y="102" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#666">uint16</text>

  <rect x="380" y="108" width="5" height="14" fill="#37a"/>
  <text x="394" y="120" font-weight="600" font-size="13" fill="#37a">blue</text>
  <text x="442" y="120" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#222">(time, y, x)</text>
  <text x="558" y="120" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#666">uint16</text>

  <rect x="380" y="126" width="5" height="14" fill="#736"/>
  <text x="394" y="138" font-weight="600" font-size="13" fill="#736">nir</text>
  <text x="442" y="138" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#222">(time, y, x)</text>
  <text x="558" y="138" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#666">uint16</text>

  <text x="370" y="176" font-size="12.5" font-style="italic" fill="#666">the pixel values, one full grid per band</text>

  <!-- COORDINATES (bottom-left) -->
  <text x="22" y="206" font-weight="600" fill="#333">Coordinates</text>
  <rect x="22" y="214" width="320" height="86" fill="#fff8e7" stroke="#cdbd80"/>
  <text x="34" y="232" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" fill="#222">time          (time)   datetime64[ns]</text>
  <text x="34" y="250" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" fill="#222">y             (y)      float64</text>
  <text x="34" y="268" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" fill="#222">x             (x)      float64</text>
  <text x="34" y="286" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" fill="#222">spatial_ref   ()       int32</text>
  <text x="22" y="320" font-size="12.5" font-style="italic" fill="#666">the date and the map position of every pixel</text>

  <!-- ATTRIBUTES (bottom-right) -->
  <text x="370" y="206" font-weight="600" fill="#333">Attributes</text>
  <rect x="370" y="214" width="328" height="86" fill="#f1f1f1" stroke="#aaa"/>
  <text x="382" y="232" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" fill="#222">crs:           EPSG:32647</text>
  <text x="382" y="250" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" fill="#222">grid_mapping:  spatial_ref</text>
  <text x="370" y="320" font-size="12.5" font-style="italic" fill="#666">notes about the data, like its map projection</text>
</svg>
